<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Desarrollo soluciones con código, con propósito">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F7DC8A"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FCE7A2"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6E5214"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="170" rx="22"/></clipPath>
  </defs>
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; }
    .s { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .45; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="170" fill="#080808"/>
    <path d="M0 170 L0 60 L110 170 Z" fill="#FFFFFF"/>
    <circle cx="1120" cy="160" r="60" fill="url(#sphere)"/>
    <rect x="300" y="38" width="600" height="1.2" fill="url(#gold)"/>
    <text class="t" x="600" y="92" text-anchor="middle" fill="#FFFFFF" font-size="28" font-style="italic">“Desarrollo soluciones con código, <tspan fill="#D4AF37">con propósito.</tspan>”</text>
    <rect x="300" y="118" width="600" height="1.2" fill="url(#gold)"/>
    <text class="s glow" x="600" y="146" text-anchor="middle" fill="#D4AF37" font-size="12" letter-spacing="6">SANTIAGO VILLAMIZAR MANTILLA  ·  &lt;/&gt;</text>
  </g>
  <rect x="1" y="1" width="1198" height="168" rx="21" fill="none" stroke="#D4AF37" stroke-opacity=".5" stroke-width="2"/>
</svg>
