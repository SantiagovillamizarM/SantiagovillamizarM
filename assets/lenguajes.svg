    <rect class="bar" style="animation-delay:0.36s" x="130" y="153" width="11.5" height="8" rx="4" fill="#8C6A1E"/>
  </g>
  <g class="in" style="animation-delay:0.48s">
    <text x="26" y="188" fill="#E6E6E6" font-size="13">HTML</text>
    <text x="374" y="188" fill="#D4AF37" font-size="13" font-weight="600" text-anchor="end">4.8%</text>
