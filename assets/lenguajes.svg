<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-label="LENGUAJES MÁS USADOS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .in { opacity: 0; animation: in .8s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="1" y="1" width="398" height="208" rx="12" fill="#0D0D0D" stroke="#D4AF37" stroke-opacity=".7"/>
  <text x="26" y="40" fill="#D4AF37" font-size="15" font-weight="600" letter-spacing="4">LENGUAJES MÁS USADOS</text>
  <rect x="26" y="52" width="348" height="1" fill="url(#g)"/>
  <g class="in" style="animation-delay:0.00s">
    <text x="26" y="84" fill="#E6E6E6" font-size="13">Python</text>
    <text x="374" y="84" fill="#D4AF37" font-size="13" font-weight="600" text-anchor="end">51.5%</text>
    <rect x="130" y="75" width="190" height="8" rx="4" fill="#FFFFFF" fill-opacity=".08"/>
    <rect class="bar" style="animation-delay:0.00s" x="130" y="75" width="97.9" height="8" rx="4" fill="#F7DC8A"/>
  </g>
  <g class="in" style="animation-delay:0.12s">
    <text x="26" y="110" fill="#E6E6E6" font-size="13">Java</text>
