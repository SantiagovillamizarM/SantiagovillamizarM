    <rect x="130" y="101" width="190" height="8" rx="4" fill="#FFFFFF" fill-opacity=".08"/>
    <rect class="bar" style="animation-delay:0.12s" x="130" y="101" width="44.4" height="8" rx="4" fill="#D4AF37"/>
  </g>
  <g class="in" style="animation-delay:0.24s">
    <text x="26" y="136" fill="#E6E6E6" font-size="13">JavaScript</text>
    <text x="374" y="136" fill="#D4AF37" font-size="13" font-weight="600" text-anchor="end">12.8%</text>
    <rect x="130" y="127" width="190" height="8" rx="4" fill="#FFFFFF" fill-opacity=".08"/>
    <rect class="bar" style="animation-delay:0.24s" x="130" y="127" width="24.3" height="8" rx="4" fill="#B8892B"/>
  </g>
  <g class="in" style="animation-delay:0.36s">
    <text x="26" y="162" fill="#E6E6E6" font-size="13">CSS</text>
    <text x="374" y="162" fill="#D4AF37" font-size="13" font-weight="600" text-anchor="end">6.1%</text>
