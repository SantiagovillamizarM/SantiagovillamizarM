<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="EXPERIENCIA">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F7DC8A"/><stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1.5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.5" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.6s ease-out forwards; transform: scaleX(0); }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="1" y="1" width="898" height="62" rx="12" fill="#0B0B0B" stroke="#D4AF37" stroke-opacity=".45"/>
  <rect x="1" y="1" width="6" height="62" rx="3" fill="#D4AF37"/>
  <g transform="translate(36 32) rotate(45)"><rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#D4AF37" stroke-width="2"/></g>
  <circle cx="36" cy="32" r="2.5" fill="#D4AF37"/>
  <text class="t" x="62" y="40" fill="url(#s)" font-size="22" font-weight="600" letter-spacing="6">EXPERIENCIA</text>
  <rect class="bar" x="290" y="31.5" width="540" height="1.5" fill="url(#g)"/>
</svg>
